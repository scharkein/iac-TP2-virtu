# Etape 1 : Proxmox VE 8 installe par-dessus Debian 12 (methode officielle "Install on Debian")
- hosts: pve
  become: true
  tasks:
    - name: Nom d'hote
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Retirer l'entree 127.0.1.1 (le FQDN doit pointer vers l'IP du noeud)
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        state: absent

    - name: FQDN -> IP du noeud
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^{{ node_ip }}\s'
        line: "{{ node_ip }} {{ inventory_hostname }}.{{ domain }} {{ inventory_hostname }}"

    - name: Cle du depot Proxmox
      ansible.builtin.get_url:
        url: https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg
        dest: /etc/apt/trusted.gpg.d/proxmox-release-bookworm.gpg
        mode: "0644"

    - name: Depot no-subscription (pas de depot enterprise)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-install-repo.list
        content: "deb [arch=amd64] http://download.proxmox.com/debian/pve bookworm pve-no-subscription\n"

    - name: Forcer IPv4 pour apt (NAT VMware)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99ipv4
        content: 'Acquire::ForceIPv4 "true";'

    # --- GRUB : sans disque cible enregistre dans debconf, grub-pc echoue en mode non interactif ---
    - name: Disque systeme (cible de GRUB)
      ansible.builtin.shell:
        cmd: |
          SRC=$(findmnt -no SOURCE / 2>/dev/null | sed 's/\[.*//')
          DISK=""
          # remonte de la partition / du volume LVM jusqu au disque physique
          if [ -b "$SRC" ]; then
            DISK=$(lsblk -nsro NAME,TYPE "$SRC" 2>/dev/null | awk '$2=="disk" {print $1; exit}')
          fi
          # secours : premier disque de la machine
          if [ -z "$DISK" ]; then
            DISK=$(lsblk -dnro NAME,TYPE | awk '$2=="disk" {print $1; exit}')
          fi
          echo "$DISK"
        executable: /bin/bash
      register: root_disk
      changed_when: false
      failed_when: root_disk.stdout | trim == "" or not (root_disk.stdout | trim is match('^[a-zA-Z0-9]+$'))

    - name: Disque retenu pour GRUB
      ansible.builtin.debug:
        msg: "GRUB sera installe sur /dev/{{ root_disk.stdout | trim }}"

    - name: Le disque existe bien
      ansible.builtin.command: test -b /dev/{{ root_disk.stdout | trim }}
      changed_when: false

    - name: Preseed grub-pc (disque cible)
      ansible.builtin.debconf:
        name: grub-pc
        question: grub-pc/install_devices
        vtype: multiselect
        value: "/dev/{{ root_disk.stdout | trim }}"

    - name: Preseed grub-pc (ne pas laisser la liste vide)
      ansible.builtin.debconf:
        name: grub-pc
        question: grub-pc/install_devices_empty
        vtype: boolean
        value: "false"

    - name: Terminer une installation dpkg interrompue (grub-pc a moitie configure)
      ansible.builtin.command: dpkg --configure -a
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: false

    - name: Mise a jour complete
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        lock_timeout: 300
      environment:
        DEBIAN_FRONTEND: noninteractive
        APT_LISTCHANGES_FRONTEND: none
      async: 3600
      poll: 15

    - name: Noyau Proxmox
      ansible.builtin.apt:
        name: proxmox-default-kernel
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: kernel

    - name: Redemarrage sur le noyau Proxmox
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: kernel is changed

    - name: Preseed postfix
      ansible.builtin.debconf:
        name: postfix
        question: "{{ item.q }}"
        vtype: "{{ item.t }}"
        value: "{{ item.v }}"
      loop:
        - { q: postfix/main_mailer_type, t: select, v: "Local only" }
        - { q: postfix/mailname, t: string, v: "{{ inventory_hostname }}.{{ domain }}" }

    - name: Paquets Proxmox VE
      ansible.builtin.apt:
        name: [proxmox-ve, postfix, open-iscsi, chrony, ifupdown2]
        lock_timeout: 300
      environment:
        DEBIAN_FRONTEND: noninteractive
        APT_LISTCHANGES_FRONTEND: none
      async: 3600
      poll: 15

    - name: Retirer le noyau Debian et os-prober
      ansible.builtin.apt:
        name: [linux-image-amd64, "linux-image-6.1*", os-prober]
        state: absent
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: update-grub
      ansible.builtin.command: update-grub
      changed_when: false

    - name: Mot de passe root (connexion root@pam a la web-UI)
      ansible.builtin.user:
        name: root
        password: "{{ pve_root_password | password_hash('sha512') }}"
      no_log: true

    # ------------------------------------------------------------------
    # Reseau : vmbr0 (gestion) + vmbr1 (invites NAT)
    # Applique en direct avec ifreload (pas de reboot), puis verifie.
    # Rejouable seul : ansible-playbook -e @secrets.yml 01-install-proxmox.yml --tags network
    # Une fois vmbr0 et vmbr1 presents, rien n'est reecrit (le 05 VLAN-aware n'est pas ecrase).
    # ------------------------------------------------------------------
    - name: Reseau vmbr0 / vmbr1
      tags: [network]
      block:
        - name: vmbr0 et vmbr1 sont-ils deja montes ?
          ansible.builtin.shell: ip link show vmbr0 >/dev/null 2>&1 && ip link show vmbr1 >/dev/null 2>&1
          register: bridges
          changed_when: false
          failed_when: false

        - name: Carte physique de gestion (celle qui porte node_ip, ou le port du bridge qui la porte)
          ansible.builtin.shell: |
            IF=$(ip -4 -o addr show | awk -v ip="{{ node_ip }}/" 'index($4, ip)==1 {print $2; exit}')
            [ -n "$IF" ] || exit 1
            if [ -d "/sys/class/net/$IF/brif" ]; then
              ls "/sys/class/net/$IF/brif" | grep -Ev '^(tap|veth|fwpr|fwln)' | head -n1
            else
              echo "$IF"
            fi
          args:
            executable: /bin/bash
          register: mgmt_detect
          changed_when: false
          failed_when: mgmt_detect.stdout | trim == ""
          when: bridges.rc != 0

        - name: Interface NAT et interface de gestion
          ansible.builtin.set_fact:
            nat_if: "{{ ansible_default_ipv4.interface }}"
            mgmt_if: "{{ mgmt_detect.stdout | trim }}"
          when: bridges.rc != 0

        - name: Ecrire /etc/network/interfaces
          ansible.builtin.template:
            src: interfaces.j2
            dest: /etc/network/interfaces
            backup: true
          when: bridges.rc != 0

        # L'IP de gestion passe de la carte physique au bridge : la connexion SSH
        # coupe quelques secondes. On lance donc ifreload en tache detachee.
        - name: Appliquer le reseau (ifreload detache)
          ansible.builtin.shell: sleep 2; ifreload -a > /root/ifreload.log 2>&1
          args:
            executable: /bin/bash
          async: 120
          poll: 0
          when: bridges.rc != 0

        - name: Fermer la connexion SSH devenue obsolete
          ansible.builtin.meta: reset_connection
          when: bridges.rc != 0

        - name: Attendre que le noeud reponde sur sa nouvelle interface
          ansible.builtin.wait_for_connection:
            delay: 5
            timeout: 180
          when: bridges.rc != 0

        - name: Verifier que vmbr0 et vmbr1 existent et sont montes
          ansible.builtin.shell: ip -br link show {{ item }} | grep -qE 'UP|UNKNOWN'
          loop: [vmbr0, vmbr1]
          register: bridge_check
          until: bridge_check.rc == 0
          retries: 10
          delay: 3
          changed_when: false

        - name: La config est bien persistee dans le fichier
          ansible.builtin.command: grep -qE '^iface vmbr0' /etc/network/interfaces
          changed_when: false

        - name: vmbr0 porte bien l'IP du noeud
          ansible.builtin.shell: ip -4 -o addr show dev vmbr0 | grep -qF " {{ node_ip }}/"
          changed_when: false

      rescue:
        - name: Etat reseau au moment de l'echec
          ansible.builtin.shell: |
            echo "### interfaces"; cat /etc/network/interfaces
            echo; echo "### ls /etc/network"; ls -la /etc/network/
            echo; echo "### ip -br a"; ip -br a
            echo; echo "### ifreload.log"; cat /root/ifreload.log 2>/dev/null
          args:
            executable: /bin/bash
          register: net_dump
          changed_when: false
          failed_when: false

        - name: Afficher le diagnostic
          ansible.builtin.debug:
            var: net_dump.stdout_lines

        - name: Echec du reseau
          ansible.builtin.fail:
            msg: "vmbr0/vmbr1 ne sont pas montes. Voir le diagnostic ci-dessus, et utiliser la console VMware si SSH est coupe."

    - name: Web-UI joignable sur 8006
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 8006
        timeout: 120
      delegate_to: localhost
      become: false
