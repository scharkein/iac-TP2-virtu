---
# ============================================================
# TP2 - INSTALLATION PROXMOX VE 8 SUR DEBIAN 12
#
# Noeuds :
#   pve01 : 192.168.56.11
#   pve02 : 192.168.56.12
#
# Reseau :
#   vmbr0 : gestion + Corosync
#   vmbr1 : reseau des machines virtuelles
#
# Execution :
#   ansible-playbook -i inventory.ini \
#     -e @secrets.yml 01-install-proxmox.yml
#
# Reseau uniquement :
#   ansible-playbook -i inventory.ini \
#     -e @secrets.yml 01-install-proxmox.yml --tags network
#
# Rejouable : si Proxmox VE est deja installe, les etapes lourdes
# (mise a jour, noyau, proxmox-ve) sont sautees. La section reseau est
# sautee si le TP3 (05-vlan-aware.yml) est deja applique.
# ============================================================

- name: Installation Proxmox VE 8
  hosts: pve
  become: true
  gather_facts: true

  vars:
    proxmox_repo: "deb [arch=amd64] http://download.proxmox.com/debian/pve bookworm pve-no-subscription"
    proxmox_key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
    dns_servers: ["1.1.1.1", "9.9.9.9"]

  pre_tasks:

    - name: Verifier les variables obligatoires
      ansible.builtin.assert:
        that:
          - node_ip is defined
          - guest_net is defined
          - domain is defined
          - pve_root_password is defined
          - ansible_host is defined
        fail_msg: "Une variable obligatoire est absente de l'inventory ou de secrets.yml"

    - name: Verifier que l'adresse IP de gestion correspond a l'hote
      ansible.builtin.assert:
        that:
          - node_ip == ansible_host
        fail_msg: "node_ip doit correspondre a ansible_host pour conserver la connexion SSH."

  tasks:

    # ========================================================
    # 00 - DNS ET DEPOTS DEBIAN
    #
    # Le relais DNS de VMware NAT (donne par DHCP) lache pendant les gros
    # telechargements apt ("Temporary failure resolving ..."). On impose des
    # resolveurs publics, de facon persistante (dhclient + resolv.conf).
    # ========================================================

    - name: DNS - dhclient ne doit pas ecraser les resolveurs publics
      ansible.builtin.lineinfile:
        path: /etc/dhcp/dhclient.conf
        regexp: '^\s*supersede\s+domain-name-servers'
        line: "supersede domain-name-servers {{ dns_servers | join(', ') }};"
        create: true
        owner: root
        group: root
        mode: "0644"

    - name: DNS - etat de /etc/resolv.conf
      ansible.builtin.stat:
        path: /etc/resolv.conf
      register: resolv_stat

    - name: DNS - ecrire /etc/resolv.conf (sauf s'il est gere par systemd-resolved)
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          {% for s in dns_servers %}
          nameserver {{ s }}
          {% endfor %}
          options timeout:2 attempts:3
        owner: root
        group: root
        mode: "0644"
      when: not (resolv_stat.stat.islnk | default(false)) or ('systemd' not in (resolv_stat.stat.lnk_source | default('')))

    - name: DNS - attendre une resolution fonctionnelle
      ansible.builtin.command:
        cmd: getent hosts deb.debian.org
      register: dns_check
      until: dns_check.rc == 0
      retries: 12
      delay: 5
      changed_when: false

    - name: Depots Debian - remplacer l'alias deprecie httpredir par deb.debian.org
      ansible.builtin.shell: |
        FILES=$(grep -rl 'httpredir\.debian\.org' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)
        [ -n "$FILES" ] || exit 0
        echo "$FILES" | xargs sed -i 's/httpredir\.debian\.org/deb.debian.org/g'
        echo CHANGED
      args:
        executable: /bin/bash
      register: httpredir_fix
      changed_when: "'CHANGED' in httpredir_fix.stdout"

    - name: APT - IPv4 force, nouvelles tentatives et delais plus longs
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99ipv4
        content: |
          Acquire::ForceIPv4 "true";
          Acquire::Retries "5";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
        owner: root
        group: root
        mode: "0644"

    # ========================================================
    # 01 - IDENTITE DU NOEUD
    # ========================================================

    - name: Configurer le hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Supprimer l'ancienne entree 127.0.1.1
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        state: absent
        backup: true

    - name: Configurer le FQDN du noeud
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^{{ node_ip | regex_escape }}\s'
        line: "{{ node_ip }} {{ inventory_hostname }}.{{ domain }} {{ inventory_hostname }}"
        state: present
        backup: true

    # ========================================================
    # 02 - DEPOT PROXMOX
    # ========================================================

    - name: Installer les dependances APT
      ansible.builtin.apt:
        name:
          - ca-certificates
          - wget
          - gnupg
        state: present
        update_cache: true
        lock_timeout: 300
      register: apt_deps
      until: apt_deps is succeeded
      retries: 3
      delay: 15

    - name: Installer la cle officielle Proxmox
      ansible.builtin.get_url:
        url: "{{ proxmox_key_url }}"
        dest: /etc/apt/trusted.gpg.d/proxmox-release-bookworm.gpg
        owner: root
        group: root
        mode: "0644"
      register: pve_key
      until: pve_key is succeeded
      retries: 3
      delay: 10

    - name: Configurer le depot Proxmox no-subscription
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-install-repo.list
        content: "{{ proxmox_repo }}\n"
        owner: root
        group: root
        mode: "0644"

    # ========================================================
    # 03 - PREPARATION GRUB
    # ========================================================

    - name: Detecter le disque systeme
      ansible.builtin.shell: |
        set -e

        SRC=$(findmnt -no SOURCE / | sed 's/\[.*//')
        DISK=""

        if [ -b "$SRC" ]; then
          DISK=$(lsblk -s -nro NAME,TYPE "$SRC" |
            awk '$2 == "disk" {print $1; exit}')
        fi

        if [ -z "$DISK" ]; then
          DISK=$(lsblk -dnro NAME,TYPE |
            awk '$2 == "disk" {print $1; exit}')
        fi

        [ -n "$DISK" ] || exit 1

        echo "$DISK"
      args:
        executable: /bin/bash
      register: root_disk
      changed_when: false
      failed_when: root_disk.stdout | trim == ""

    - name: Afficher le disque systeme
      ansible.builtin.debug:
        msg: "GRUB sera configure sur /dev/{{ root_disk.stdout | trim }}"

    - name: Verifier le disque systeme
      ansible.builtin.command:
        cmd: "test -b /dev/{{ root_disk.stdout | trim }}"
      changed_when: false

    - name: Preconfigurer le disque GRUB
      ansible.builtin.debconf:
        name: grub-pc
        question: grub-pc/install_devices
        vtype: multiselect
        value: "/dev/{{ root_disk.stdout | trim }}"

    - name: Preconfigurer grub-pc install_devices_empty
      ansible.builtin.debconf:
        name: grub-pc
        question: grub-pc/install_devices_empty
        vtype: boolean
        value: "false"

    - name: Terminer une configuration dpkg interrompue
      ansible.builtin.command:
        cmd: dpkg --configure -a
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: false

    # ========================================================
    # 04 a 08 - INSTALLATION (sautee si Proxmox VE est deja installe)
    # ========================================================

    - name: Proxmox VE deja installe ?
      ansible.builtin.shell: |
        dpkg-query -W -f='${Status}' proxmox-ve 2>/dev/null | grep -q 'install ok installed'
      args:
        executable: /bin/bash
      register: pve_installed
      failed_when: false
      changed_when: false

    - name: Installation de Proxmox VE (mise a jour, noyau, paquets)
      when: pve_installed.rc != 0
      block:

        # ----- 04 - MISE A JOUR DE DEBIAN -----

        - name: Mise a jour complete du systeme
          ansible.builtin.apt:
            update_cache: true
            upgrade: dist
            lock_timeout: 300
          environment:
            DEBIAN_FRONTEND: noninteractive
            APT_LISTCHANGES_FRONTEND: none
          async: 3600
          poll: 15
          register: apt_upgrade
          until: apt_upgrade is succeeded
          retries: 3
          delay: 20

        # ----- 05 - NOYAU PROXMOX -----

        - name: Installer le noyau Proxmox
          ansible.builtin.apt:
            name: proxmox-default-kernel
            state: present
            update_cache: true
            lock_timeout: 300
          environment:
            DEBIAN_FRONTEND: noninteractive
          register: kernel_install
          until: kernel_install is succeeded
          retries: 3
          delay: 20

        # On teste le noyau REELLEMENT actif (et non "kernel_install.changed") :
        # si un run precedent a installe le noyau puis plante avant le reboot,
        # on redemarre quand meme.
        - name: Noyau actuellement demarre
          ansible.builtin.command:
            cmd: uname -r
          register: running_kernel
          changed_when: false

        - name: Redemarrer sur le noyau Proxmox si necessaire
          ansible.builtin.reboot:
            msg: "Redemarrage sur le noyau Proxmox"
            reboot_timeout: 600
            connect_timeout: 10
            post_reboot_delay: 15
            test_command: uname -r
          when: "'-pve' not in running_kernel.stdout"

        - name: Verifier que le noyau Proxmox est actif
          ansible.builtin.command:
            cmd: uname -r
          register: kernel_after
          changed_when: false
          failed_when: "'-pve' not in kernel_after.stdout"

        # ----- 06 - POSTFIX -----

        - name: Preconfigurer Postfix
          ansible.builtin.debconf:
            name: postfix
            question: "{{ item.question }}"
            vtype: "{{ item.type }}"
            value: "{{ item.value }}"
          loop:
            - question: postfix/main_mailer_type
              type: select
              value: "Local only"

            - question: postfix/mailname
              type: string
              value: "{{ inventory_hostname }}.{{ domain }}"

        # ----- 07 - PAQUETS PROXMOX VE -----

        - name: Installer les paquets Proxmox VE
          ansible.builtin.apt:
            name:
              - proxmox-ve
              - postfix
              - open-iscsi
              - chrony
              - ifupdown2
            state: present
            lock_timeout: 300
          environment:
            DEBIAN_FRONTEND: noninteractive
            APT_LISTCHANGES_FRONTEND: none
          async: 3600
          poll: 15
          register: pve_install
          until: pve_install is succeeded
          retries: 3
          delay: 30

        # ----- 08 - NETTOYAGE DU NOYAU DEBIAN -----

        - name: Retirer le noyau Debian generique
          ansible.builtin.apt:
            name:
              - linux-image-amd64
              - os-prober
            state: absent
            purge: false
            autoremove: false
            lock_timeout: 300
          environment:
            DEBIAN_FRONTEND: noninteractive

        - name: Mettre a jour GRUB
          ansible.builtin.command:
            cmd: update-grub
          changed_when: false

    # ========================================================
    # 09 - MOT DE PASSE ROOT PROXMOX
    #
    # Sel fixe (derive du nom du noeud) : sinon password_hash genere un
    # sel aleatoire et la tache est "changed" a chaque execution.
    # ========================================================

    - name: Configurer le mot de passe root
      ansible.builtin.user:
        name: root
        password: "{{ pve_root_password | password_hash('sha512', (inventory_hostname | hash('sha256'))[:16]) }}"
        update_password: always
      no_log: true

    # ========================================================
    # 10 - CONFIGURATION RESEAU PROXMOX
    #
    # vmbr0 : gestion / Corosync
    # vmbr1 : reseau des machines virtuelles
    #
    # Cette section est rejouable. Elle est sautee si le TP3
    # (05-vlan-aware.yml) est deja applique : sinon elle remplacerait le
    # fichier VLAN-aware par la version TP2 (sans VLAN ni vmbr0.99).
    # ========================================================

    - name: Le reseau TP3 (VLAN-aware) est-il deja applique ?
      ansible.builtin.stat:
        path: /etc/network/interfaces.pre-tp3
      register: tp3_net
      tags:
        - network
        - always

    - name: Configuration reseau Proxmox
      tags:
        - network
      when: not tp3_net.stat.exists

      block:

        # ----------------------------------------------------
        # DETECTION DES INTERFACES
        # ----------------------------------------------------

        - name: Detecter les interfaces physiques
          ansible.builtin.shell: |
            set -e

            # Interface portant l'adresse de gestion
            MGMT=$(ip -4 -o addr show |
              awk -v ip="{{ node_ip }}" '
                {
                  split($4, a, "/")
                  if (a[1] == ip) {
                    print $2
                    exit
                  }
                }')

            if [ -z "$MGMT" ]; then
              echo "IP de gestion introuvable : {{ node_ip }}" >&2
              exit 1
            fi

            # Si l'adresse est deja sur vmbr0,
            # retrouver le port physique du bridge.
            if [ -d "/sys/class/net/$MGMT/brif" ]; then

              PORTS=$(find "/sys/class/net/$MGMT/brif" \
                -mindepth 1 -maxdepth 1 -printf '%f\n')

              COUNT=$(printf '%s\n' "$PORTS" |
                grep -c . || true)

              if [ "$COUNT" -ne 1 ]; then
                echo "vmbr0 doit avoir exactement un port physique" >&2
                exit 1
              fi

              MGMT=$(printf '%s\n' "$PORTS" | head -n1)
            fi

            # Interface de la route par defaut
            NAT=$(ip -4 route show default |
              awk '
                NR == 1 {
                  for (i=1; i<=NF; i++) {
                    if ($i == "dev") {
                      print $(i+1)
                      exit
                    }
                  }
                }')

            if [ -z "$NAT" ]; then
              echo "Interface NAT introuvable" >&2
              exit 1
            fi

            # Si la route passe par un bridge,
            # retrouver son interface physique.
            if [ -d "/sys/class/net/$NAT/brif" ]; then

              PORTS=$(find "/sys/class/net/$NAT/brif" \
                -mindepth 1 -maxdepth 1 -printf '%f\n')

              COUNT=$(printf '%s\n' "$PORTS" |
                grep -c . || true)

              if [ "$COUNT" -ne 1 ]; then
                echo "Impossible de retrouver le port NAT" >&2
                exit 1
              fi

              NAT=$(printf '%s\n' "$PORTS" | head -n1)
            fi

            if [ "$MGMT" = "$NAT" ]; then
              echo "ERREUR : NAT et gestion utilisent la meme interface" >&2
              exit 1
            fi

            test -e "/sys/class/net/$MGMT"
            test -e "/sys/class/net/$NAT"

            echo "$MGMT"
            echo "$NAT"

          args:
            executable: /bin/bash

          register: detected_interfaces
          changed_when: false

        - name: Enregistrer les interfaces reseau
          ansible.builtin.set_fact:
            mgmt_if: "{{ detected_interfaces.stdout_lines[0] }}"
            nat_if: "{{ detected_interfaces.stdout_lines[1] }}"

        - name: Afficher les interfaces detectees
          ansible.builtin.debug:
            msg:
              - "Interface gestion : {{ mgmt_if }}"
              - "Interface NAT : {{ nat_if }}"
              - "IP gestion : {{ node_ip }}"
              - "Reseau invites : {{ guest_net }}.0/24"

        # ----------------------------------------------------
        # SAUVEGARDE DE LA CONFIGURATION
        # ----------------------------------------------------

        - name: Creer le dossier de sauvegarde reseau
          ansible.builtin.file:
            path: /root/network-backups
            state: directory
            owner: root
            group: root
            mode: "0700"

        # ----------------------------------------------------
        # FORWARDING IPV4
        # ----------------------------------------------------

        - name: Persister le forwarding IPv4
          ansible.builtin.copy:
            dest: /etc/sysctl.d/99-proxmox-forwarding.conf
            content: |
              net.ipv4.ip_forward=1
            owner: root
            group: root
            mode: "0644"
          register: forwarding_config

        - name: Appliquer le forwarding IPv4
          ansible.builtin.command:
            cmd: sysctl --system
          when: forwarding_config.changed
          changed_when: true

        # ----------------------------------------------------
        # GENERATION DU FICHIER RESEAU
        # ----------------------------------------------------

        # L'IP statique d'eth1 posee par le Vagrantfile ferait double emploi
        # avec le bridge vmbr0 (qui porte deja cette IP) : on la retire.
        - name: Retirer l'eth1 statique du Vagrantfile (vmbr0 prend le relais)
          ansible.builtin.file:
            path: /etc/network/interfaces.d/00-vagrant-mgmt
            state: absent
          register: vagrant_eth1_removed

        - name: Generer la configuration reseau
          ansible.builtin.template:
            src: interfaces.j2
            dest: /etc/network/interfaces
            owner: root
            group: root
            mode: "0644"
            backup: true
          register: network_config

        # ----------------------------------------------------
        # VERIFICATION DE LA CONFIGURATION EXISTANTE
        # ----------------------------------------------------

        - name: Verifier la configuration reseau active
          ansible.builtin.shell: |
            set -e

            # Bridges presents
            ip link show vmbr0 >/dev/null
            ip link show vmbr1 >/dev/null

            # IP de gestion
            ip -4 -o addr show dev vmbr0 |
              grep -qF " {{ node_ip }}/"

            # Port physique de vmbr0
            test -L "/sys/class/net/{{ mgmt_if }}/master"

            test "$(basename "$(readlink -f /sys/class/net/{{ mgmt_if }}/master)")" = "vmbr0"

            # Adresse de vmbr1
            ip -4 -o addr show dev vmbr1 |
              grep -qF " {{ guest_net }}.1/"

            # vmbr1 doit etre sans port physique
            test -d /sys/class/net/vmbr1/brif

            test -z "$(ls -A /sys/class/net/vmbr1/brif)"

            # Route par defaut conservee via NAT
            ip -4 route show default |
              grep -q "dev {{ nat_if }}"

          args:
            executable: /bin/bash

          register: network_state
          changed_when: false
          failed_when: false

        # ----------------------------------------------------
        # APPLICATION DU RESEAU
        # ----------------------------------------------------

        - name: Sauvegarder la configuration avant application
          ansible.builtin.copy:
            src: /etc/network/interfaces
            dest: /root/network-backups/interfaces-before-apply
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          when: network_config.changed or network_state.rc != 0

        - name: Verifier la syntaxe de la configuration
          ansible.builtin.command:
            cmd: ifquery --list
          changed_when: false
          when: network_config.changed or network_state.rc != 0

        - name: Appliquer le reseau avec ifreload
          ansible.builtin.shell: |
            sleep 3
            ifreload -a > /root/ifreload.log 2>&1
          args:
            executable: /bin/bash
          async: 120
          poll: 0
          when: network_config.changed or network_state.rc != 0

        - name: Reinitialiser la connexion SSH
          ansible.builtin.meta: reset_connection
          when: network_config.changed or network_state.rc != 0

        - name: Attendre le retour de la connexion SSH
          ansible.builtin.wait_for_connection:
            delay: 5
            timeout: 180
            sleep: 5
          when: network_config.changed or network_state.rc != 0

        # ----------------------------------------------------
        # VALIDATION FINALE
        # ----------------------------------------------------

        - name: Verifier la presence des deux bridges
          ansible.builtin.command:
            cmd: "ip link show {{ item }}"
          loop:
            - vmbr0
            - vmbr1
          changed_when: false

        - name: Verifier l'adresse de gestion
          ansible.builtin.shell: |
            ip -4 -o addr show dev vmbr0 |
            grep -qF " {{ node_ip }}/"
          changed_when: false

        - name: Verifier le port physique de vmbr0
          ansible.builtin.shell: |
            test "$(basename "$(readlink -f /sys/class/net/{{ mgmt_if }}/master)")" = "vmbr0"
          changed_when: false

        - name: Verifier l'adresse du reseau invites
          ansible.builtin.shell: |
            ip -4 -o addr show dev vmbr1 |
            grep -qF " {{ guest_net }}.1/"
          changed_when: false

        - name: Verifier la route Internet
          ansible.builtin.command:
            cmd: ip -4 route show default
          register: default_route
          changed_when: false
          failed_when: "('dev ' ~ nat_if) not in default_route.stdout"

        - name: Verifier la configuration persistante
          ansible.builtin.shell: |
            set -e

            grep -qF "bridge-ports {{ mgmt_if }}" /etc/network/interfaces
            grep -qF "address {{ node_ip }}/24" /etc/network/interfaces
            grep -qF "bridge-ports none" /etc/network/interfaces
            grep -qF "address {{ guest_net }}.1/24" /etc/network/interfaces

          args:
            executable: /bin/bash
          changed_when: false

        # ----------------------------------------------------
        # DIAGNOSTIC EN CAS D'ERREUR
        # ----------------------------------------------------

      rescue:

        - name: Collecter les informations reseau
          ansible.builtin.shell: |
            echo "========== INTERFACES =========="
            ip -br addr

            echo "========== ROUTES =========="
            ip route

            echo "========== BRIDGES =========="
            bridge link

            echo "========== CONFIGURATION =========="
            cat /etc/network/interfaces

            echo "========== IFRELOAD =========="
            cat /root/ifreload.log 2>/dev/null || true

          args:
            executable: /bin/bash

          register: network_diagnostic
          changed_when: false
          failed_when: false

        - name: Afficher le diagnostic
          ansible.builtin.debug:
            var: network_diagnostic.stdout_lines

        - name: Signaler une erreur reseau
          ansible.builtin.fail:
            msg: >-
              La configuration reseau Proxmox a echoue.
              Consulter le diagnostic et utiliser la console VMware
              si la connexion SSH est interrompue.

    # ========================================================
    # 11 - VERIFICATION WEB UI PROXMOX
    # ========================================================

    - name: Attendre que le service Web Proxmox reponde
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 8006
        state: started
        timeout: 180
        sleep: 5
      delegate_to: localhost
      become: false

    - name: Afficher le resultat de l'installation
      ansible.builtin.debug:
        msg:
          - "Installation Proxmox terminee sur {{ inventory_hostname }}"
          - "Web UI : https://{{ node_ip }}:8006"
          - "Gestion : vmbr0 / {{ node_ip }}"
          - "Reseau invites : vmbr1 / {{ guest_net }}.1"
